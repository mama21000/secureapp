<VirtualHost *:80>
    ServerName 10.96.1.107
    DocumentRoot /var/www/html/public

    UseCanonicalName On
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^10\.96\.1\.107$ [NC]
    RewriteRule ^ - [R=400,L]
    RewriteRule ^ https://10.96.1.107:443%{REQUEST_URI} [L,R=301]

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# Prevent Slowloris Attacks (Keep connections short)
Timeout 30
KeepAlive On
MaxKeepAliveRequests 150
KeepAliveTimeout 5

# Limit Request Sizes (Prevents Buffer Overflows / Memory Exhaustion)

# Max 10MB per request (covers your 1MB avatar + overhead)
LimitRequestBody 10485760    

# Max 50 headers
LimitRequestFields 50       

# Max 16KB per header
LimitRequestFieldSize 16384
